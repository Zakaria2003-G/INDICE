<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recherche Indices & Conservation foncière</title>
<style>
:root { --bg:#f3f7fb; --card:#ffffff; --ink:#172033; --muted:#64748b; --primary:#1e40af; --accent:#0891b2; --soft:#e0f2fe; --line:#dbe6f3; }
*{box-sizing:border-box} body{margin:0; min-height:100vh; font-family:Inter,Segoe UI,Roboto,Arial,sans-serif; background:radial-gradient(circle at 15% 10%,#dbeafe 0,#f8fafc 32%,#eef6ff 100%); color:var(--ink)}
.wrapper{max-width:1100px; margin:0 auto; padding:38px 20px 60px}
.hero{display:grid; grid-template-columns:1.1fr .9fr; gap:22px; align-items:stretch; margin-bottom:22px}
.panel{background:rgba(255,255,255,.82); backdrop-filter:blur(12px); border:1px solid rgba(219,230,243,.9); border-radius:28px; box-shadow:0 24px 70px rgba(15,23,42,.10); overflow:hidden}
.titlebox{padding:34px; background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 48%,#06b6d4 100%); color:white}
h1{margin:0 0 12px; font-size:34px; line-height:1.15; letter-spacing:-.04em} .subtitle{font-size:16px; line-height:1.6; opacity:.93; max-width:620px}
.stats{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; padding:22px}
.stat{padding:20px; border-radius:22px; background:#f8fbff; border:1px solid var(--line)} .stat b{display:block; font-size:28px; color:#1d4ed8} .stat span{color:var(--muted); font-size:13px}
.search{padding:24px}
.controls{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:18px}
label{font-weight:800; font-size:13px; display:block; margin-bottom:8px; color:#334155}
select,input{width:100%; border:1px solid var(--line); border-radius:16px; padding:14px 15px; font-size:15px; outline:none; background:white; color:#111827; transition:.15s}
select:focus,input:focus{border-color:#38bdf8; box-shadow:0 0 0 4px rgba(56,189,248,.16)}
.hint{font-size:13px; color:var(--muted); margin-top:8px}
.toolbar{display:grid; grid-template-columns:1fr auto; gap:14px; align-items:end; margin:18px 0 20px}
button{border:0; border-radius:16px; padding:14px 18px; background:#0f172a; color:white; font-weight:800; cursor:pointer; box-shadow:0 10px 20px rgba(15,23,42,.12)} button:hover{transform:translateY(-1px)}
.results{display:grid; gap:12px; margin-top:8px}
.empty{border:1px dashed #cbd5e1; background:#f8fafc; color:#64748b; padding:24px; border-radius:20px; text-align:center}
.card{display:flex; justify-content:space-between; align-items:center; gap:16px; padding:16px 18px; border:1px solid var(--line); border-radius:18px; background:linear-gradient(180deg,#fff,#fbfdff); box-shadow:0 8px 18px rgba(15,23,42,.045)}
.card .main{font-weight:850; font-size:16px} .badge{white-space:nowrap; border-radius:999px; padding:7px 11px; background:var(--soft); color:#075985; font-weight:800; font-size:12px}
.note{margin-top:16px; padding:14px 16px; border-radius:18px; background:#eff6ff; color:#1e3a8a; font-size:13px; line-height:1.5}
@media(max-width:800px){.hero,.controls,.toolbar{grid-template-columns:1fr} h1{font-size:28px}}
</style>
</head>
<body>
  <!-- test -->
<div class="wrapper">
  <section class="hero">
    <div class="panel titlebox">
      <h1>Recherche Indices & Conservation foncière</h1>
      <div class="subtitle">Sélectionne un indice ou une conservation foncière pour afficher les correspondances utiles dans les deux sens.</div>
    </div>
    <div class="panel stats">
      <div class="stat"><b id="statIndices">—</b><span>Indices disponibles</span></div>
      <div class="stat"><b id="statCons">—</b><span>Conservations foncières</span></div>
    </div>
  </section>

  <main class="panel search">
    <div class="controls">
      <div>
        <label for="mode">Sens de recherche</label>
        <select id="mode">
          <option value="indice">Indice → Conservation foncière</option>
          <option value="conservation">Conservation foncière → Indices</option>
        </select>
      </div>
      <div>
        <label id="selectLabel" for="selector">Indice</label>
        <select id="selector"></select>
        <div class="hint">Les résultats avec moins de 20 occurrences ont été exclus.</div>
      </div>
    </div>
    <div class="toolbar">
      <div>
        <label for="filter">Filtrer dans les résultats</label>
        <input id="filter" placeholder="Tape pour chercher dans les correspondances…">
      </div>
      <button id="exportBtn">Exporter CSV</button>
    </div>
    <div id="summary" class="note"></div>
    <div id="results" class="results"></div>
  </main>
</div>

<script>
const DATA = JSON.parse(document.getElementById('app-data').textContent);
const mode = document.getElementById('mode');
const selector = document.getElementById('selector');
const selectLabel = document.getElementById('selectLabel');
const filter = document.getElementById('filter');
const results = document.getElementById('results');
const summary = document.getElementById('summary');
document.getElementById('statIndices').textContent = DATA.indices.length;
document.getElementById('statCons').textContent = DATA.conservations.length;
function normalizeText(s){ return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[._\-/\]+/g,' ').replace(/[^a-z0-9]+/g,' ').trim(); }
function fillSelector(){
  const m = mode.value;
  const list = m === 'indice' ? DATA.indices : DATA.conservations;
  selectLabel.textContent = m === 'indice' ? 'Indice' : 'Conservation foncière';
  selector.innerHTML = '';
  list.forEach(v => { const opt=document.createElement('option'); opt.value=v; opt.textContent=v; selector.appendChild(opt); });
  filter.value=''; render();
}
function currentItems(){
  const v = selector.value;
  return mode.value === 'indice' ? (DATA.byIndex[v] || []) : (DATA.byConservation[v] || []);
}
function render(){
  const selected = selector.value;
  let items = currentItems();
  const q = normalizeText(filter.value);
  if(q) items = items.filter(x => normalizeText(x).includes(q));
  results.innerHTML='';
  const sens = mode.value === 'indice' ? 'conservation(s) foncière(s)' : 'indice(s)';
  summary.textContent = selected ? `Correspondances affichées pour « ${selected} » : ${items.length} ${sens}.` : 'Sélectionne une valeur pour afficher les correspondances.';
  if(!items.length){ results.innerHTML='<div class="empty">Aucune correspondance à afficher.</div>'; return; }
  items.forEach(item => {
    const card = document.createElement('div'); card.className='card';
    const main = document.createElement('div'); main.className='main'; main.textContent=item;
    const badge = document.createElement('div'); badge.className='badge'; badge.textContent = mode.value === 'indice' ? 'Conservation foncière' : 'Indice';
    card.append(main,badge); results.appendChild(card);
  });
}
function csvEscape(v){ return '"' + String(v).replaceAll('"','""') + '"'; }
document.getElementById('exportBtn').addEventListener('click', () => {
  const leftName = mode.value === 'indice' ? 'Indice' : 'Conservation fonciere';
  const rightName = mode.value === 'indice' ? 'Conservation fonciere' : 'Indice';
  const leftVal = selector.value;
  const rows = [[leftName,rightName], ...currentItems().map(x => [leftVal,x])];
  const csv = rows.map(r => r.map(csvEscape).join(';')).join('\\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='correspondances_indices_conservation.csv'; a.click(); URL.revokeObjectURL(a.href);
});
mode.addEventListener('change', fillSelector); selector.addEventListener('change', render); filter.addEventListener('input', render);
fillSelector();
</script>
